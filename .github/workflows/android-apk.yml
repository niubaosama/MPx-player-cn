name: 检查与编译安卓汉化版

on:
  workflow_dispatch:
  push:
    paths:
      - 'lib/**'
      - 'android/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: 检查源码与测试（按需生成 APK）
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: 获取源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 配置 Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: 配置 Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true

      - name: 获取项目依赖
        run: flutter pub get

      - name: 静态分析
        # 原项目已有未使用字段和旧 API 警告，保留提示，编译错误仍会阻止构建。
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: 检查语言、存储来源与媒体索引
        timeout-minutes: 5
        run: flutter test test/localization_test.dart test/library_index_test.dart test/reel_sources_test.dart test/reel_sources_sheet_test.dart test/directory_browser_test.dart

      # 分批修改期间保留原有全量回归失败记录；交付 APK 时必须全部通过。
      - name: 全量回归（记录后续批次待修复项）
        timeout-minutes: 5
        continue-on-error: ${{ github.event_name != 'workflow_dispatch' && !contains(github.event.head_commit.message, '[build-apk]') }}
        run: flutter test

      - name: 检查下载模块的汉化
        run: python -B -m unittest discover -s test -p 'downloader_localization_test.py' -v

      # 沿用原项目的测试签名，仅供首轮安装验证，后续长期版本需配置固定私有签名。
      # 分批修改先运行检查；最终提交带 [build-apk] 时生成安装包。
      - name: 编译 ARM64 测试包
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-apk]')
        run: flutter build apk --release --target-platform android-arm64

      - name: 保存 APK
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-apk]')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MPx-player-cn-arm64-test
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
